name: GTAA Bot

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      GTAA_WEBHOOK: ${{ secrets.GTAA_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run first attempt without Discord
        run: |
          SKIP_DISCORD=1 node strategy.js
          SKIP_DISCORD=1 node strategy1x.js

      - name: Check retry after first attempt
        id: retry1
        run: |
          NEEDS_RETRY=$(node <<'NODE'
          const fs = require("fs");
          const s3 = JSON.parse(fs.readFileSync("signals.json", "utf8"));
          const s1 = JSON.parse(fs.readFileSync("signals1x.json", "utf8"));
          console.log(s3.needsRetry || s1.needsRetry ? "true" : "false");
          NODE
          )

          echo "needs_retry=$NEEDS_RETRY" >> "$GITHUB_OUTPUT"
          echo "Retry needed after first attempt: $NEEDS_RETRY"

      - name: Wait before second attempt
        if: steps.retry1.outputs.needs_retry == 'true'
        run: |
          sleep 60

      - name: Run second attempt without Discord
        if: steps.retry1.outputs.needs_retry == 'true'
        run: |
          SKIP_DISCORD=1 node strategy.js
          SKIP_DISCORD=1 node strategy1x.js

      - name: Check retry after second attempt
        id: retry2
        run: |
          NEEDS_RETRY=$(node <<'NODE'
          const fs = require("fs");
          const s3 = JSON.parse(fs.readFileSync("signals.json", "utf8"));
          const s1 = JSON.parse(fs.readFileSync("signals1x.json", "utf8"));
          console.log(s3.needsRetry || s1.needsRetry ? "true" : "false");
          NODE
          )

          echo "needs_retry=$NEEDS_RETRY" >> "$GITHUB_OUTPUT"
          echo "Retry needed after second attempt: $NEEDS_RETRY"

      - name: Wait before third attempt
        if: steps.retry2.outputs.needs_retry == 'true'
        run: |
          sleep 60

      - name: Run final attempt with Discord
        run: |
          node strategy.js
          node strategy1x.js

      - name: Commit and push changes
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"

          git add signals.json signals1x.json state.json
          git commit -m "update signals" || echo "no changes"
          git push
