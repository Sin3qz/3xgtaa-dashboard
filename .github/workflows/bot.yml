name: GTAA Bot

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      GTAA_WEBHOOK: ${{ secrets.GTAA_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node strategy.js

      - run: node strategy1x.js

      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add signals.json signals1x.json state.json
          git commit -m "update signals" || echo "no changes"
          git push
