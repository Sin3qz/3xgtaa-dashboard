<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>3x GTAA Dashboard</title>

  <style>

    body {
      background: #0d1117;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2 {
      margin-bottom: 20px;
      margin-top: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 40px;
      background: #161b22;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #30363d;
      text-align: center;
    }

    th {
      background: #21262d;
    }

    tr:hover {
      background: #1f2937;
    }

    .green {
      color: #00ff88;
      font-weight: bold;
    }

    .red {
      color: #ff5c5c;
      font-weight: bold;
    }

    .invested {
      background: #2457c5;
    }

    .excluded {
      background: #6aa8ff;
      color: black;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <h1>📊 3x GTAA Dashboard</h1>

  <table>

    <thead>
      <tr>
        <th>Rank</th>
        <th>Asset</th>
        <th>1M</th>
        <th>3M</th>
        <th>6M</th>
        <th>9M</th>
        <th>Momentumscore (%)</th>
        <th>SMA150 (%)</th>
        <th>SMA20>SMA150 (%)</th>
      </tr>
    </thead>

    <tbody id="table"></tbody>

  </table>

  <h2>📈 Historische Kurse</h2>

  <table>

    <thead>
      <tr>
        <th>Asset</th>
        <th>Preis vor 1M</th>
        <th>Preis vor 3M</th>
        <th>Preis vor 6M</th>
        <th>Preis vor 9M</th>
        <th>Aktuell</th>
      </tr>
    </thead>

    <tbody id="prices"></tbody>

  </table>

  <script src="app.js"></script>

</body>
</html>
